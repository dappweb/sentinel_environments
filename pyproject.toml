[project]
name = "sentinel_environments"
version = "0.1.0"
description = "Environments for testing and training web Sentinel agents."
authors = [
    {name = "Microsoft", email = "noreply@microsoft.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ruff",
    "poethepoet",
    "codespell",
    "requests>=2.32.4",
    "beautifulsoup4>=4.14.3",
    "openai>=2.9.0",
    "mysql-connector-python>=9.5.0",
]

[tool.setuptools]
packages = [
  "webarena",
  "webarena.shopping",
  "webarena.shopping.events",
  "webarena.shopping.utils",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    ".pytest_cache",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "D", # docstrings
]
ignore = ["E501", "UP017"]  # line too long, UTC alias

[tool.poe.tasks]
# Formatting tasks
format = "ruff format --check --diff webarena"
format-fix = "ruff format webarena"

# Linting tasks
lint = "ruff check webarena/forum"
lint-fix = "ruff check --fix --unsafe-fixes webarena/forum"

# Spell checking
spell = "codespell -I .codespellignore docs/**/*.md webarena/**/*.py webarena/**/*.md webarena/**/*.bash webarena/forum/**/*.json"

# Combined quality checks
check-all = ["format", "lint", "spell"]
fix-all = ["format-fix", "lint-fix"]
