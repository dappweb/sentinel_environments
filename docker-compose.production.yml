services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      ROBINHOOD_CHAIN_NETWORK: ${ROBINHOOD_CHAIN_NETWORK:-testnet}
      ROBINHOOD_CHAIN_TIMEOUT_SECONDS: ${ROBINHOOD_CHAIN_TIMEOUT_SECONDS:-5}
      ROBINHOOD_CHAIN_PRICE_FEEDS_JSON: ${ROBINHOOD_CHAIN_PRICE_FEEDS_JSON:-}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/chain/robinhood/config').read()
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_PRIVY_APP_ID: ${VITE_PRIVY_APP_ID:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

  cloudflared:
    image: cloudflare/cloudflared:2026.6.1
    restart: unless-stopped
    network_mode: host
    depends_on:
      - frontend
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
